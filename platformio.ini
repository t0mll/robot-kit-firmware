; Robot Kit Shop Firmware: the Robot Shell library plus one sketch per Robot.
; Core pinned to Arduino-ESP32 2.0.17 (espressif32@6.10.0) so MicroBlocks can run inside the Shell:
; https://github.com/t0mll/robot-kit-shop/issues/104

[platformio]
src_dir = robots
default_envs = rover, biped

; Shared by every Robot (the Brain). The native env below is host-only unit tests, so it doesn't extend this.
[brain]
platform = platformio/espressif32@6.10.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.2.33
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
extra_scripts = pre:scripts/version.py

[env:rover]
extends = brain
build_src_filter = -<*> +<rover/>
lib_deps =
    ${brain.lib_deps}
    pololu/VL53L0X@1.3.1

[env:biped]
extends = brain
build_src_filter = -<*> +<biped/>

; Host unit tests for the Shell's pure logic (pio test -e native). Only Arduino-free headers are
; included, so the RobotShell library itself isn't built here.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = RobotShell
build_flags = -std=c++17 -Ilib/RobotShell/src
