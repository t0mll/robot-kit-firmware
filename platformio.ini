; Robot Kit Shop Firmware: the Robot Shell library plus one sketch per Robot.
; Core pinned to Arduino-ESP32 2.0.17 (espressif32@6.10.0) so MicroBlocks can run inside the Shell:
; https://github.com/t0mll/robot-kit-shop/issues/104

[platformio]
src_dir = robots
default_envs = rover, biped

[env]
platform = platformio/espressif32@6.10.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.2.33
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
extra_scripts = pre:scripts/version.py

[env:rover]
build_src_filter = -<*> +<rover/>
lib_deps =
    ${env.lib_deps}
    pololu/VL53L0X@1.3.1

[env:biped]
build_src_filter = -<*> +<biped/>
