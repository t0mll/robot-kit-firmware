name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach binaries to releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install "platformio==6.1.18" "esptool==4.8.1"
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(git rev-parse --short HEAD)"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Build every Robot
        run: pio run
        env:
          FW_VERSION: ${{ steps.version.outputs.value }}
      - name: Package (merged binaries + ESP Web Tools manifests)
        run: python scripts/package.py "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.value }}
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*/*.bin dist/*/manifest.json --title "$GITHUB_REF_NAME" --generate-notes
